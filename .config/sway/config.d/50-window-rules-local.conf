# ~/.config/sway/config.d/50-window-rules-local.conf
# 让指定程序始终以浮窗打开。Wayland 原生窗口用 app_id，X11/XWayland 窗口用 class。
# 生效：swaymsg reload（对已经打开的窗口要再手动执行一次命令，见 README 说明）

# 微信（官方 Linux 版 4.x 是 Wayland 原生，app_id=wechat）
for_window [app_id="wechat"] floating enable, move position center


# 老版本/第三方微信客户端（X11）兜底
for_window [class="wechat" instance="wechat"] floating enable, move position center
for_window [class="WeChat"] floating enable, move position center

for_window [app_id="org.kde.okular"] move container to workspace 4, workspace 4
for_window [class="wpsoffice" instance="wpsoffice"] move container to workspace 5, workspace 5
for_window [app_id="net.thunderbird.Thunderbird"] move container to workspace 9, workspace 9

# 如果你希望固定大小，去掉下面一行的注释（单位像素），例如：
# for_window [app_id="wechat"] resize set 1100 750

# 同类“聊天/弹窗型”程序的写法参考：
#   for_window [app_id="com.tencent.qq"] floating enable, move position center
#   for_window [class="TelegramDesktop"] floating enable
# 查窗口的真实标识（程序开着时执行）：
#   swaymsg -t get_tree | jq -r '.. | objects | select(.type=="con")
#       | "\(.app_id // "-") | \(.window_properties.class // "-") | \(.name // "")"'
