# ~/.config/sway/config.d/40-gaps-local.conf
#
# 窗口间隙（sway 1.11 原生支持，不需要 swayfx）。
#   inner：相邻窗口之间、以及窗口与工作区边缘之间的空隙
#   outer：整个工作区四周额外留白，与 inner 叠加
# 当前边框是 default_border pixel 2，所以 inner 8 的实际观感 = 2px 边框 + 8px 空隙。
# 生效：swaymsg reload。
#   配置里的 gaps 只作为「工作区没有自己 gaps 设置时」的默认值；
#   已存在的工作区要立刻统一，用：swaymsg gaps inner all set 8; swaymsg gaps outer all set 4

gaps inner 8
gaps outer 4

# 单个窗口的工作区不加间隙（铺满屏），多窗口才出现间隙。
# 想让单窗口也保留 outer 留白，改成 inverse_outer。
smart_gaps on
# smart_gaps inverse_outer
