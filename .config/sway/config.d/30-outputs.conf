# 合盖外接时禁用内屏，避免工作区切到看不见的 eDP-1
exec_always sh -c 'export SWAYSOCK=${SWAYSOCK:-$(ls /run/user/1000/sway-ipc.*.sock 2>/dev/null | head -1)}; if grep -q closed /proc/acpi/button/lid/*/state 2>/dev/null && swaymsg -t get_outputs 2>/dev/null | grep -q HDMI-A-1; then swaymsg output eDP-1 disable; fi'
bindswitch lid:on exec sh -c 'export SWAYSOCK=${SWAYSOCK:-$(ls /run/user/1000/sway-ipc.*.sock 2>/dev/null | head -1)}; swaymsg -t get_outputs 2>/dev/null | grep -q HDMI-A-1 && swaymsg output eDP-1 disable'
bindswitch lid:off exec sh -c 'export SWAYSOCK=${SWAYSOCK:-$(ls /run/user/1000/sway-ipc.*.sock 2>/dev/null | head -1)}; swaymsg output eDP-1 enable'
