# ~/.config/sway/config.d/60-bindings-local.conf
# 没有 KDE 面板之后的「菜单入口」：Wi-Fi / 音量。由 sway 的 layered include 自动加载。
# 生效：swaymsg reload

# $mod+n：弹出 Wi-Fi 菜单（nmtui：选网、输密码、802.1X、开关 radio 都在里面）
bindsym Mod4+n exec foot --app-id=nmtui --title=Wi-Fi nmtui

# $mod+Shift+v：音量面板（需要 sudo dnf install pavucontrol；没装会弹通知提醒）
bindsym Mod4+Shift+v exec sh -c 'command -v pavucontrol >/dev/null && exec pavucontrol || notify-send "pavucontrol 未安装：sudo dnf install pavucontrol"'

# 这些是「菜单型」窗口，浮动居中，不要被平铺
for_window [app_id="nmtui"] floating enable, resize set 60 ppt 60 ppt, move position center
for_window [app_id="pavucontrol"] floating enable, resize set 50 ppt 60 ppt, move position center
